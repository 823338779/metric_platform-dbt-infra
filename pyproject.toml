[project]
name = "dbt-metricflow-service"
version = "0.1.0"
description = "Standalone HTTP wrapper for dbt and MetricFlow"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "dbt-core==1.12.5",
  "dbt-metricflow==0.15.0",
  "dbt-duckdb==1.11.0",
  "dbt-starrocks==1.12.2",
  "fastapi==0.141.1",
  "metricflow==0.213.0",
  "pyyaml==6.0.3",
  "uvicorn==0.53.0",
  "dbt-postgres==1.11.0",
  "psycopg2-binary==2.9.13",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
]

[tool.uv.sources]
dbt-core = { path = "vendor/dbt/core" }
dbt-metricflow = { path = "vendor/metricflow/dbt-metricflow" }
metricflow = { path = "vendor/metricflow" }

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
]

[project.scripts]
dbt-metricflow-service = "dbt_metricflow_service.main:run"
dbt-service-admin = "dbt_metricflow_service.admin:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_metricflow_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
# 自有服务代码必须明确参数和返回类型；开放引擎载荷仍允许显式 Any。
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ruff.lint.per-file-ignores]
# pytest fixture 和测试替身沿用现有签名，不扩展本次改动到测试体系。
"tests/**" = ["ANN"]
