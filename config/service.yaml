# 服务启动配置。环境变量优先于本文件；相对路径以本文件所在目录为基准。
# 可通过 SERVICE_CONFIG_FILE 指定其他 YAML 文件，服务与管理命令共用该文件。

# HTTP 监听地址与端口。
SERVICE_HOST: "0.0.0.0"
SERVICE_PORT: 8000

# PostgreSQL 元数据库连接；使用独立的当前版本 schema，环境变量可覆盖。
SERVICE_DATABASE_URL: "postgresql:///?user=data_agent&password=data_agent_local_dev&connect_timeout=5&dbname=dbt_service&host=localhost&port=5432&options=-c%20search_path%3Dpublic"

# 可信物理实例清单；请求中的 instanceId、类型、主机和端口必须与之匹配。
EXECUTION_INSTANCES:
  local-starrocks:
    type: starrocks
    hosts: [localhost, 127.0.0.1]
    port: 9030

# 数据库凭据直接在本文件中填写；本地 StarRocks 使用空密码。
EXECUTION_CREDENTIALS:
  local-starrocks:
    user: root
    password: ""

# PostgreSQL 模式可丢弃的实例工作目录；使用短路径避免 Windows 的 260 字符限制。
# 多副本必须使用各自独立目录。
SERVICE_TEMP_ROOT: "../../tmp/dbt"

# 每个 stdout/stderr 保留的最大字节数。
MAX_OUTPUT_BYTES: 1048576

# 实例并发执行数、任务租约有效期及续租间隔（秒）；租约至少是间隔的三倍。
WORKER_CONCURRENCY: 2
JOB_LEASE_SECONDS: 90
JOB_HEARTBEAT_SECONDS: 15

# 当前实例的运行配置标识和工具链标识。
# 工具链标识为 null 时，根据安装版本和服务代码自动计算。
SERVICE_CONFIG_VERSION: "local-debug"
SERVICE_TOOLCHAIN_VERSION: "dbt-core 1.12.5 / metricflow 0.213.0"

# 公开查询/维度/血缘响应、单产物文件、单产物集的字节上限。
MAX_RESULT_BYTES: 8388608
MAX_ARTIFACT_FILE_BYTES: 67108864
MAX_ARTIFACT_BYTES: 268435456

# 同步查询选项与清理接口等待持久任务的最大秒数。
